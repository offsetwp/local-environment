; PHP settings of the Docker image, for local development.

; The limits follow the .env of the project: DOCKER_PHP_MEMORY_LIMIT,
; DOCKER_PHP_UPLOAD_MAX_SIZE and DOCKER_PHP_MAX_EXECUTION_TIME, which compose.yaml hands
; over as PHP_*, always with a value. No fallback after ":-": PHP reads it from 8.3
; only, and below, it would take an empty value instead.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_SIZE}
post_max_size = ${PHP_UPLOAD_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}

; $_ENV holds the variables of the container, so that compose.yaml can set DB_HOST:
; Symfony Dotenv never overrides a variable already there. It is PHP's own default,
; restated because php.ini-development and php.ini-production both drop the E.
variables_order = "EGPCS"

; A change in the code shows on the next request.
opcache.revalidate_freq = 0

; Errors go to the output of the container (vendor/bin/local-environment logs php). What
; a page shows is left to WordPress, which follows WP_DEBUG. Until WordPress loads,
; the level is that of the official WordPress image: no notices nor deprecations, which
; would come before the headers (docker-library/wordpress#420).
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_CORE_ERROR | E_CORE_WARNING | E_COMPILE_ERROR | E_COMPILE_WARNING | E_RECOVERABLE_ERROR
log_errors = On
error_log = /dev/stderr
ignore_repeated_errors = On
ignore_repeated_source = On

; Every email WordPress sends lands in Mailpit, on http://localhost:8025.
sendmail_path = "/usr/local/bin/mailpit sendmail -S mailpit:1025"

; Xdebug is loaded, but off. XDEBUG_MODE in .env turns it on: develop, debug, profile…
xdebug.mode = off
xdebug.client_host = host.docker.internal
